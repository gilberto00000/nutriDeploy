{% extends 'base.html' %}
{% load static %}
{% block title %}Login | NutriFoco{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{% static 'css/contas/entrar.css' %}">{% endblock %}
{% block topbar_nav %}{% endblock %}
{% block content %}
<section class="card">
    <h2>Entrar</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Entrar</button>
    </form>
    <p class="login-signup">Não tem conta? <a href="{% url 'signup_patient' %}">Cadastre-se</a></p>
</section>
{% endblock %}
