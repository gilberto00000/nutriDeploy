{% extends 'base.html' %}

{% block content %}
<div class="container">

    <h2>Meus Agendamentos</h2>

    {% for ag in agendamentos %}
        <div class="card">
            <p><strong>Data:</strong> {{ ag.data }}</p>
            <p><strong>Hora:</strong> {{ ag.hora }}</p>
            <p><strong>Nutricionista:</strong> {{ ag.nutritionist }}</p>
        </div>
    {% empty %}
        <p>Nenhum agendamento encontrado.</p>
    {% endfor %}

</div>
{% endblock %}
