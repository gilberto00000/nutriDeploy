{% extends 'base.html' %}

{% block content %}
<section class="card form-card">
    <h2>Agendar Consulta</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <div class="form-actions">
            <button type="submit" class="btn">Agendar</button>
            <a href="{% url 'dashboard_paciente' %}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
