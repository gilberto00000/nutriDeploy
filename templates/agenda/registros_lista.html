{% extends 'base.html' %}

{% block content %}
<section class="card">
    <h2>Histórico de registros</h2>

    <table>
        <tr>
            <th>Data</th>
            <th>Refeição</th>
            <th>Seguiu</th>
        </tr>

        {% for log in logs %}
        <tr>
            <td>{{ log.date }}</td>
            <td>{{ log.meal.name }}</td>
            <td>{% if log.followed %}Sim{% else %}Não{% endif %}</td>
        </tr>
        {% empty %}
        <tr><td colspan="3">Nenhum registro.</td></tr>
        {% endfor %}
    </table>
</section>
{% endblock %}
